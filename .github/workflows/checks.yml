name: Application checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: rotm
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: rotm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rotm -d rotm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rotm:ci_only@localhost:5432/rotm_test
      TEST_DATABASE_URL: postgresql://rotm:ci_only@localhost:5432/rotm_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
