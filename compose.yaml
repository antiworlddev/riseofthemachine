services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: rotm
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: rotm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rotm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotm -d rotm"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rotm_postgres:
